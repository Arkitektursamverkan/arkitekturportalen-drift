# Arkitekturportalen på Render (Blueprint). Se docs/render.md.
#
# Samma avbilder som docker compose-installationen, men varje del är en egen
# tjänst: Render sköter TLS och domäner (ingen Caddy), databaserna är Render
# Postgres och diskarna Render Disks. Plattformens Redis behövs inte.
#
# Inget behöver fyllas i. Render frågar bara efter Entra-uppgifterna, på
# portal-api och bara när blueprinten skapas: lämna dem tomma för egna konton
# (första besöket skapar administratören). Med Entra fylls de i där och ingen
# annanstans – plattformen och Arkitekten hämtar dem från portalen. Adresserna
# lär sig tjänsterna själva. Byt versionerna nedan vid en uppgradering.
#
# Avbilderna är privata: lägg först in en registerinloggning för ghcr.io i
# Render (Workspace Settings → Registry Credentials) med namnet "ghcr".

databases:
  # Inget databaseName eller user: Render lägger till ett eget suffix på
  # databasens namn (ea_db → ea_db_46gd), och namnet går inte att ändra efter
  # skapandet – med namnet utskrivet slutade varje synk med fel (troligen
  # för att den försökte ändra namnet). Tjänsterna får hela adressen ur connectionString, så namnen
  # behövs inte.
  - name: portal-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # bara Renders interna nät

  - name: plattform-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ── Portalen ──────────────────────────────────────────────────────────────
  - type: pserv
    name: portal-api
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/arkitekturportalen-api:0.16.1
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    # Ögonblicksbilder och synkprofiler – på en och samma disk.
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Api:t lyssnar på 8000. Utan PORT antar Render 10000, och de andra
      # tjänsterna får då fel port i den interna adressen (hostport) – det
      # märks när allt skapas på en gång, som i en ny Blueprint.
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString
      - key: EA_DB_ENGINE
        value: postgres
      - key: APP_ENV
        value: production
      - key: SNAPSHOT_DIR
        value: /var/data/snapshots
      - key: SYNC_PROFILES_PATH
        value: /var/data/sync/sync_profiles.json
      - key: API_KEY
        generateValue: true
      - key: LOCAL_AUTH_SECRET
        generateValue: true
      - key: SYNC_WEBHOOK_SECRET
        generateValue: true
      # Engångskoden för portalens första administratörskonto. Står under
      # portal-api → Environment. Plattformen och Arkitekten har var sin.
      - key: SETUP_CODE
        generateValue: true
      # Entra – en app-registrering för hela installationen, ifylld HÄR och
      # ingen annanstans: plattformen och Arkitekten hämtar uppgifterna från
      # portalen (GET /api/v1/installation). Tomt = egna konton överallt.
      # Klienthemligheten används av Arkitekten, inte av portalen själv.
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
      # Alla moduler påslagna; de stängs av under Administration → Organisation.
      - key: MODULES
        value: all
      - key: ANONYMOUS_READ
        value: "false"
      # Plattformens administratörsnyckel skapas här och läses av plattform-api
      # (ADMIN_API_KEY). Plattformens adress anmäler plattformen själv.
      # portal-api pekar alltså inte på någon annan tjänst: med referenser åt
      # båda hållen (portal-api ↔ plattform-api) slutade varje synk med fel.
      # Både läsning och "Hämta nu" – ingen separat läsnyckel behövs.
      - key: INTEGRATION_PLATFORM_ADMIN_KEY
        generateValue: true
      # Portalens egen adress lärs ur förfrågningarna, och Arkitekten anmäler
      # sin – inga adresser att fylla i.

  - type: web
    name: portal-web
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/arkitekturportalen-web:0.16.1
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: portal-api
          property: hostport
      # Renders proxy står framför: klientens adress ur X-Forwarded-For
      # (gränsen för inloggningsförsök). Renders interna nät.
      - key: TRUSTED_PROXY
        value: 10.0.0.0/8

  # ── Integrationsplattformen ───────────────────────────────────────────────
  - type: pserv
    name: plattform-api
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/integrationsplattformen-api:0.10.0
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    envVars:
      # Api:t lyssnar på 8000. Utan PORT antar Render 10000, och de andra
      # tjänsterna får då fel port i den interna adressen (hostport) – det
      # märks när allt skapas på en gång, som i en ny Blueprint.
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        fromDatabase:
          name: plattform-db
          property: connectionString
      - key: APP_ENV
        value: production
      # Byts den blir sparade inloggningar till källsystemen oläsbara.
      - key: ENCRYPTION_KEY
        generateValue: true
      # Samma nyckel som portalen använder mot plattformen (skapas där).
      - key: ADMIN_API_KEY
        fromService:
          type: pserv
          name: portal-api
          envVarKey: INTEGRATION_PLATFORM_ADMIN_KEY
      - key: JWT_SECRET
        generateValue: true
      # Entra-uppgifterna hämtas från portalen (med webhookhemligheten nedan),
      # och plattformen anmäler där sin egen adress.
      - key: PORTAL_URL
        fromService:
          type: pserv
          name: portal-api
          property: hostport
      # Arkitektens flödestjänst (port 8200) – källan skapas vid starten.
      - key: ARKITEKTEN_URL
        fromService:
          type: web
          name: arkitekten
          property: host
      - key: ARK_FLODESTJANST_NYCKEL
        fromService:
          type: web
          name: arkitekten
          envVarKey: ARK_FLODESTJANST_NYCKEL
      # Bakom plattformens webb (nginx): klientens adress ur X-Forwarded-For.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: POST_EXEC_WEBHOOK_SECRET
        fromService:
          type: pserv
          name: portal-api
          envVarKey: SYNC_WEBHOOK_SECRET
      # Engångskoden för plattformens första administratörskonto
      # (plattform-api → Environment).
      - key: SETUP_CODE
        generateValue: true

  - type: web
    name: plattform-web
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/integrationsplattformen-web:0.10.0
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: plattform-api
          property: hostport
      # Renders proxy står framför: klientens adress ur X-Forwarded-For
      # (gränsen för inloggningsförsök). Renders interna nät.
      - key: TRUSTED_PROXY
        value: 10.0.0.0/8

  # ── Arkitekten (processritaren) ───────────────────────────────────────────
  # Webben och flödestjänsten i samma tjänst – de delar disken. Plattformen
  # hämtar processbilderna från flödestjänsten på port 8200 (internt).
  - type: web
    name: arkitekten
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/arkitekten:0.10.0
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    disk:
      name: arkitekten-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ARK_FLODESTJANST_PORT
        value: "8200"
      # Plattformen skickar samma nyckel till flödestjänsten.
      - key: ARK_FLODESTJANST_NYCKEL
        generateValue: true
      # Renders proxy står framför: klientens adress ur X-Forwarded-For
      # (spärren mot lösenordsgissning).
      - key: ARK_BETRODD_PROXY
        value: "1"
      # ARK_BAS_URL behövs bara med egen domän (https://arkitekten.example.org);
      # utan den används onrender.com-adressen. Läggs till under Environment.
      - key: ARK_SESSION_SECRET
        generateValue: true
      # Entra när portalen har Entra-uppgifterna (hämtas vid start),
      # annars egna konton – första besöket skapar administratören. Ändras
      # Entra på portal-api: starta om arkitekten.
      - key: ARK_AUTH
        value: auto
      # Publiceringen till portalen, över Renders interna nät. Arkitekten
      # anmäler också sin adress där och hämtar portalens adress och Entra.
      - key: EA_API_URL
        fromService:
          type: pserv
          name: portal-api
          property: hostport
      - key: EA_API_KEY
        fromService:
          type: pserv
          name: portal-api
          envVarKey: API_KEY
      # Engångskoden för Arkitektens första administratörskonto
      # (arkitekten → Environment).
      - key: SETUP_CODE
        generateValue: true
