# Arkitekturportalen på Render (Blueprint). Se docs/render.md.
#
# Samma avbilder som docker compose-installationen, men varje del är en egen
# tjänst: Render sköter TLS och domäner (ingen Caddy), databaserna är Render
# Postgres och diskarna Render Disks. Plattformens Redis behövs inte.
#
# Värden med "sync: false" frågar Render efter när blueprinten skapas – bara
# då. Entra-uppgifterna (en och samma app-registrering för alla tre) frågas
# efter på varje tjänst som behöver dem: klistra in samma värden. Lämna dem
# tomma för egna konton; första besöket skapar då administratören. Bara värden
# som alltid finns (de som Render skapar och de interna adresserna) hämtas från
# en annan tjänst – ett tomt fält går inte att hämta. Byt versionerna nedan vid
# en uppgradering.
#
# Avbilderna är privata: lägg först in en registerinloggning för ghcr.io i
# Render (Workspace Settings → Registry Credentials) med namnet "ghcr".

databases:
  - name: portal-db
    databaseName: ea_db
    user: ea_user
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # bara Renders interna nät

  - name: plattform-db
    databaseName: integration_db
    user: integration_user
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  # ── Portalen ──────────────────────────────────────────────────────────────
  - type: pserv
    name: portal-api
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/arkitekturportalen-api:0.10.0
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    # Ögonblicksbilder och synkprofiler – på en och samma disk.
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString
      - key: EA_DB_ENGINE
        value: postgres
      - key: APP_ENV
        value: production
      - key: SNAPSHOT_DIR
        value: /var/data/snapshots
      - key: SYNC_PROFILES_PATH
        value: /var/data/sync/sync_profiles.json
      - key: API_KEY
        generateValue: true
      - key: LOCAL_AUTH_SECRET
        generateValue: true
      - key: SYNC_WEBHOOK_SECRET
        generateValue: true
      # Portalens adress, t.ex. https://arkitektur.example.org
      - key: CORS_ORIGINS
        sync: false
      - key: PDF_APP_BASE_URL
        sync: false
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAIL_DOMAINS
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
      # Moduler, kommaseparerade (calendar,collaboration,governance,glossary,
      # surveys,changes,arkitekten) eller "all".
      - key: MODULES
        sync: false
      - key: ANONYMOUS_READ
        value: "false"
      # Plattformen, över Renders interna nät (host:port räcker).
      - key: INTEGRATION_PLATFORM_URL
        fromService:
          type: pserv
          name: plattform-api
          property: hostport
      # Både läsning och "Hämta nu" – ingen separat läsnyckel behövs.
      - key: INTEGRATION_PLATFORM_ADMIN_KEY
        fromService:
          type: pserv
          name: plattform-api
          envVarKey: ADMIN_API_KEY
      - key: ARKITEKTEN_URL
        sync: false

  - type: web
    name: portal-web
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/arkitekturportalen-web:0.10.0
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: portal-api
          property: hostport
      # Samma värden som på portal-api. Render kan bara hämta ett värde från en
      # annan tjänst när det redan finns, och de här får vara tomma.
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ARKITEKTEN_URL
        sync: false

  # ── Integrationsplattformen ───────────────────────────────────────────────
  - type: pserv
    name: plattform-api
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/integrationsplattformen-api:0.4.0
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plattform-db
          property: connectionString
      - key: APP_ENV
        value: production
      # Byts den blir sparade inloggningar till källsystemen oläsbara.
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      # Plattformens adress, t.ex. https://plattform.example.org
      - key: CORS_ORIGINS
        sync: false
      # Samma app-registrering som portalen (tomt = bara egna konton).
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
      # Arkitektens flödestjänst (port 8200) – källan skapas vid starten.
      - key: ARKITEKTEN_URL
        fromService:
          type: web
          name: arkitekten
          property: host
      - key: POST_EXEC_WEBHOOK_SECRET
        fromService:
          type: pserv
          name: portal-api
          envVarKey: SYNC_WEBHOOK_SECRET

  - type: web
    name: plattform-web
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/integrationsplattformen-web:0.4.0
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: plattform-api
          property: hostport

  # ── Arkitekten (processritaren) ───────────────────────────────────────────
  # Webben och flödestjänsten i samma tjänst – de delar disken. Plattformen
  # hämtar processbilderna från flödestjänsten på port 8200 (internt).
  - type: web
    name: arkitekten
    runtime: image
    image:
      url: ghcr.io/arkitektursamverkan/arkitekten:0.5.0
      creds:
        fromRegistryCreds:
          name: ghcr
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    disk:
      name: arkitekten-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: ARK_FLODESTJANST_PORT
        value: "8200"
      # Arkitektens adress, t.ex. https://arkitekten.example.org
      - key: ARK_BAS_URL
        sync: false
      - key: ARK_SESSION_SECRET
        generateValue: true
      # Entra när de tre Entra-fälten nedan är ifyllda, annars egna konton
      # (första besöket skapar administratören).
      - key: ARK_AUTH
        value: auto
      - key: ENTRA_TENANT_ID
        sync: false
      - key: ENTRA_CLIENT_ID
        sync: false
      - key: ENTRA_CLIENT_SECRET
        sync: false
      # Publiceringen till portalen, över Renders interna nät.
      - key: EA_API_URL
        fromService:
          type: pserv
          name: portal-api
          property: hostport
      - key: EA_API_KEY
        fromService:
          type: pserv
          name: portal-api
          envVarKey: API_KEY
      # Portalens adress (som PDF_APP_BASE_URL på portal-api).
      - key: EA_WEBB_URL
        sync: false
      # Administratörer med Entra – samma som på portal-api.
      - key: BOOTSTRAP_ADMIN_EMAILS
        sync: false
